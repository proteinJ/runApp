<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Baton WebSocket Test</title>
    <!-- STOMP 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h2>Baton 러닝 실시간 테스트</h2>
<button onclick="connect()">1. 1004번 방 접속 & 구독</button>
<button onclick="sendLocation()">2. 내 위치 보내기</button>
<div id="messages" style="margin-top: 20px; font-family: monospace;"></div>

<script>
    let stompClient = null;
    const groupId = "1004";

    function connect() {
        // 스프링부트 주소 (ws:// 로컬)
        let socket = new WebSocket('ws://127.0.0.1:8080/ws/run');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            printLog('연결 성공: ' + frame);

            // 구독 (남의 위치 받기)
            stompClient.subscribe('/topic/group/' + groupId, function (message) {
                printLog('🏃‍♂️ [수신됨] ' + message.body);
            });
        });
    }

    function sendLocation() {
        let data = JSON.stringify({
            'memberId': 1,
            'lat': 35.1533, // 서면 근처 좌표
            'lng': 129.0596
        });
        // 발행 (내 위치 보내기)
        stompClient.send("/app/location/" + groupId, {}, data);
        printLog('📤 [발송함] ' + data);
    }

    function printLog(message) {
        let msgDiv = document.getElementById('messages');
        msgDiv.innerHTML += "<p>" + message + "</p>";
    }
</script>
</body>
</html>
