name: Spring Boot & Docker CI/CD

# 1. 'on' (언제 실행할 것인가?) - 필수
on:
  push:
    branches: [ "develop" ]

# 2. 'jobs' (무슨 일을 할 것인가?) - 필수
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 코드를 가져옵니다.
        uses: actions/checkout@v3

      - name: Java 17 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 권한 부여 및 빌드
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 도커 이미지 빌드 및 푸시
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/runapp-server .
          docker push ${{ secrets.DOCKER_USERNAME }}/runapp-server

      - name: 서버에 접속해서 배포 (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/runapp-server
            docker stop runapp || true
            docker rm runapp || true
            docker run -d -p 8080:8080 --name runapp ${{ secrets.DOCKER_USERNAME }}/runapp-server