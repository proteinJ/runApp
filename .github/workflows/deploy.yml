name: Spring Boot & Docker CI/CD

on:
  push:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 코드를 가져옵니다.
        uses: actions/checkout@v3

      - name: Java 17 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 권한 부여 및 빌드
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 도커 이미지 빌드 및 푸시
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/runapp-server .
          docker push ${{ secrets.DOCKER_USERNAME }}/runapp-server

      - name: 서버에 접속해서 배포 (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,DB_URL,DB_USERNAME,DB_PASSWORD,DB_NAME,REDIS_HOST,REDIS_PORT,JWT_SECRET,JWT_ACCESS_TOKEN_TIME,JWT_REFRESH_TOKEN_TIME
          script: |
            echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
            docker pull $DOCKER_USERNAME/runapp-server
            docker stop runapp || true
            docker rm runapp || true
            docker run -d -p 8080:8080 --name runapp \
              --restart always \
              -e DB_URL=$DB_URL \
              -e DB_USERNAME=$DB_USERNAME \
              -e DB_PASSWORD=$DB_PASSWORD \
              -e DB_NAME=$DB_NAME \
              -e REDIS_HOST=$REDIS_HOST \
              -e REDIS_PORT=$REDIS_PORT \
              -e JWT_SECRET=$JWT_SECRET \
              -e JWT_ACCESS_TOKEN_TIME=$JWT_ACCESS_TOKEN_TIME \
              -e JWT_REFRESH_TOKEN_TIME=$JWT_REFRESH_TOKEN_TIME \
              $DOCKER_USERNAME/runapp-server
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TOKEN_TIME: ${{ secrets.JWT_ACCESS_TOKEN_TIME }}
          JWT_REFRESH_TOKEN_TIME: ${{ secrets.JWT_REFRESH_TOKEN_TIME }}